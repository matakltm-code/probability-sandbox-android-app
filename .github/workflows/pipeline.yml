name: Main Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Generate Gradle Wrapper
      run: gradle wrapper
      
    - name: Generate Dummy google-services.json
      run: |
        echo '{"project_info":{"project_number":"12345","project_id":"dummy","storage_bucket":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:12345:android:12345","android_client_info":{"package_name":"com.example.dfbebd"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
        
    - name: Generate Temporary Keystore
      run: |
        keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass temp1234 -keypass temp1234 -dname "CN=GitHub, OU=Actions, O=CI, L=Internet, ST=Global, C=US"
        
    - name: Build Release APK
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/release.jks
        STORE_PASSWORD: temp1234
        KEY_PASSWORD: temp1234
      run: ./gradlew assembleRelease
      
    - name: Get Commit Message
      id: get_commit
      run: echo "msg=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }} - ${{ steps.get_commit.outputs.msg }}
        body: |
          ### What's New
          - ${{ steps.get_commit.outputs.msg }}
          
          Automated release containing the latest built APK from the main branch.
        generate_release_notes: true
        files: app/build/outputs/apk/release/*.apk
