name: Lint Check

on:
  pull_request:
    branches: [ "**" ]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Generate Gradle Wrapper
      run: gradle wrapper
      
    - name: Run Lint
      run: ./gradlew lintDebug
